name: Gemini Mine Android Debug

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Accept Android SDK licenses and install components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Validate APK and Package Metadata
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== Step A: Validate APK exists and non-empty ==="
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK does not exist or is empty at $APK_PATH"
            exit 1
          fi
          echo "APK found: $APK_PATH (Size: $(stat -c%s "$APK_PATH") bytes)"

          echo "=== Step B: Print SHA-256 ==="
          sha256sum "$APK_PATH"

          echo "=== Step C & D & E: Inspect Native Libraries ==="
          unzip -l "$APK_PATH" | grep "lib/"
          
          # Verify ARM64 native library exists
          if ! unzip -l "$APK_PATH" | grep -q "lib/arm64-v8a/libgeminimine.so"; then
            echo "ERROR: lib/arm64-v8a/libgeminimine.so not found in APK"
            exit 1
          fi
          echo "PASS: lib/arm64-v8a/libgeminimine.so present"

          # Verify armeabi-v7a is NOT included
          if unzip -l "$APK_PATH" | grep -q "lib/armeabi-v7a/"; then
            echo "ERROR: Unexpected armeabi-v7a library found in APK"
            exit 1
          fi
          echo "PASS: No armeabi-v7a library present"

          echo "=== Step F, G, H, I: Validate Android Manifest & Badging ==="
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          BADGING_DUMP=$($AAPT dump badging "$APK_PATH")
          echo "$BADGING_DUMP"

          # Package ID check
          echo "$BADGING_DUMP" | grep -q "package: name='com.artemjsdx.geminimine'" || {
            echo "ERROR: Package name is not com.artemjsdx.geminimine"
            exit 1
          }
          echo "PASS: Package name is com.artemjsdx.geminimine"

          # Application label check
          echo "$BADGING_DUMP" | grep -q "application-label:'Gemini Mine'" || {
            echo "ERROR: Application label is not 'Gemini Mine'"
            exit 1
          }
          echo "PASS: Application label is 'Gemini Mine'"

          # Launcher activity check
          echo "$BADGING_DUMP" | grep -q "launchable-activity: name='com.artemjsdx.geminimine.MainActivity'" || {
            echo "ERROR: Launchable activity is not com.artemjsdx.geminimine.MainActivity"
            exit 1
          }
          echo "PASS: Launchable activity is com.artemjsdx.geminimine.MainActivity"

          # SensorLandscape check (ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE = 6 or 0x6 in binary manifest)
          MANIFEST_XML=$(${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/apkanalyzer manifest print "$APK_PATH")
          echo "$MANIFEST_XML"
          if echo "$MANIFEST_XML" | grep -q 'android:screenOrientation="6"\|android:screenOrientation="sensorLandscape"'; then
            echo "PASS: sensorLandscape (screenOrientation=6) orientation confirmed in manifest"
          else
            echo "ERROR: sensorLandscape not found in manifest"
            exit 1
          fi

          echo "=== Step J: Enforced 16 KB Page-Size ELF Alignment & GNU_RELRO Check ==="
          mkdir -p /tmp/ci_extracted_libs
          unzip -q -o "$APK_PATH" "lib/arm64-v8a/*" -d /tmp/ci_extracted_libs
          export READELF="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          
          python3 - << 'PYEOF'
          import os, subprocess, sys
          readelf = os.environ.get("READELF", "llvm-readelf")
          lib_dir = "/tmp/ci_extracted_libs/lib/arm64-v8a"
          so_files = [f for f in os.listdir(lib_dir) if f.endswith(".so")]
          if not so_files:
              print("ERROR: No .so files found in arm64-v8a directory")
              sys.exit(1)

          failed = False
          for so in sorted(so_files):
              full_path = os.path.join(lib_dir, so)
              print(f"--- Checking ELF headers for {so} ---")
              out = subprocess.check_output([readelf, "-l", full_path]).decode("utf-8")
              has_relro = False
              load_aligns = []
              for line in out.splitlines():
                  if "GNU_RELRO" in line:
                      has_relro = True
                  if "LOAD" in line:
                      parts = line.strip().split()
                      align_val = int(parts[-1], 16)
                      load_aligns.append(align_val)
              
              print(f"  LOAD segment alignments: {[hex(a) for a in load_aligns]}")
              print(f"  GNU_RELRO present: {has_relro}")
              
              if not load_aligns:
                  print(f"  FAIL: No LOAD segments found in {so}")
                  failed = True
              for align in load_aligns:
                  if align < 0x4000:
                      print(f"  FAIL: {so} has LOAD alignment {hex(align)} < 0x4000 (16 KB)")
                      failed = True
              if not failed:
                  print(f"  PASS: {so} is strictly 16 KB aligned (>= 0x4000)")

          if failed:
              print("ERROR: One or more shared libraries failed 16 KB ELF alignment verification")
              sys.exit(1)
          print("ALL ARM64 ELF libraries passed 16 KB page-size alignment checks")
          PYEOF

          echo "=== Step K: Official APK 16 KB Zip-Alignment Verification ==="
          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/36.0.0/zipalign"
          $ZIPALIGN -v -c -P 16 4 "$APK_PATH" | tail -n 25
          if ! $ZIPALIGN -c -P 16 4 "$APK_PATH"; then
            echo "ERROR: zipalign 16 KB page alignment verification failed"
            exit 1
          fi
          echo "PASS: zipalign 16 KB page alignment verification successful"


          echo "=== Step L: GameActivity JNI Symbol Regression Guard ==="
          export NM="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          python3 - << 'PYEOF'
          import os, subprocess, sys
          nm = os.environ.get("NM", "llvm-nm")
          so_path = "/tmp/ci_extracted_libs/lib/arm64-v8a/libgeminimine.so"
          out = subprocess.check_output([nm, "-D", so_path]).decode("utf-8")
          required_symbol = "Java_com_google_androidgamesdk_GameActivity_initializeNativeCode"
          if required_symbol in out:
              print(f"PASS: Required JNI entry point '{required_symbol}' is exported in libgeminimine.so")
          else:
              print(f"ERROR: Missing required JNI entry point '{required_symbol}' in {so_path}")
              sys.exit(1)
          PYEOF

          echo "=== All CI validations passed successfully! ==="

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GeminiMine-GM001-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
